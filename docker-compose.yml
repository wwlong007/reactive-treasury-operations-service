services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: treasury
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_local
    ports: ["5432:5432"]
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - treasury-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d treasury"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    environment:
      TREASURY_R2DBC_URL: r2dbc:postgresql://postgres:5432/treasury
      TREASURY_JDBC_URL: jdbc:postgresql://postgres:5432/treasury
      TREASURY_JWT_ISSUER: http://host.docker.internal:8081/realms/treasury
    ports: ["8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
volumes:
  treasury-postgres:

