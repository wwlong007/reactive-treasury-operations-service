spring:
  application:
    name: reactive-treasury-control-service
  main:
    web-application-type: reactive
  r2dbc:
    url: ${TREASURY_R2DBC_URL:r2dbc:postgresql://localhost:5432/treasury}
    username: ${TREASURY_DB_APP_USER:treasury_app}
    password: ${TREASURY_DB_APP_PASSWORD:treasury_app_local}
  flyway:
    url: ${TREASURY_JDBC_URL:jdbc:postgresql://localhost:5432/treasury}
    user: ${TREASURY_DB_OWNER_USER:treasury_owner}
    password: ${TREASURY_DB_OWNER_PASSWORD:treasury_owner_local}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${TREASURY_JWT_ISSUER:http://localhost:8081/realms/treasury}
          jwk-set-uri: ${TREASURY_JWT_JWK_SET_URI:http://localhost:8081/realms/treasury/protocol/openid-connect/certs}
treasury:
  database:
    pool:
      max-size: ${TREASURY_DB_POOL_MAX_SIZE:10}
server:
  shutdown: graceful
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  observations:
    key-values:
      service: ${spring.application.name}
springdoc:
  api-docs:
    path: /v3/api-docs
logging:
  structured:
    format:
      console: logstash
